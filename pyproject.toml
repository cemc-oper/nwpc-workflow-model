[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nwpc-workflow-model"
dynamic = ["version"]
description = "A workflow model using in operation systems at CEMC/CMA."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "perillaroc", email = "perillaroc@gmail.com"},
]
keywords = ["nwpc", "workflow", "model"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cemc-oper/nwpc-workflow-model"

[project.optional-dependencies]
test = [
    "pytest",
]
cov = [
    "pytest-cov",
    "codecov",
]

[project.entry-points]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "/nwpc_workflow_model",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["nwpc_workflow_model"]

[tool.hatch.build]
exclude = [
    "docs",
    "contrib",
]
